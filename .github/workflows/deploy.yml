name: deploy

# 推 main 自动把站点发到国内机（129.204.52.104，腾讯云），由宿主机 nginx 直接发静态文件。
# 目标地址：https://yunshufz.top
#
# ⚠️ 这台机器上还跑着 ocrtext.top（小程序后端，/etc/nginx/conf.d/ocrtext.top.conf）。
# 本工作流只做加法：
#   - 只往 /var/www/yunshufz.top/ 写文件，不碰别的目录；
#   - nginx 配置只写自己的 /etc/nginx/conf.d/yunshufz.top.conf；
#   - 每次 reload 前先 `nginx -t`，不过就到此为止（nginx 仍在跑旧配置，别的站点无感）；
#   - 只 `systemctl reload`，绝不 `restart`（restart 会让同机所有站点瞬断）；
#   - 发布后回查 ocrtext.top，若从「改动前 200」变成「不是 200」就判定事故并失败。
#
# 需要的仓库 secrets / variables：
#   DEPLOY_HOST     129.204.52.104
#   DEPLOY_USER     ubuntu
#   DEPLOY_SSH_KEY  ~/.ssh/memorial_deploy 的内容（这台机器上 ubuntu 用户认可的那把）
#   DEPLOY_PORT     可选，默认 22
#   SITE_ROOT       可选，默认 /var/www/yunshufz.top
#   NGINX_CONF      可选，默认 /etc/nginx/conf.d/yunshufz.top.conf
#   GUARD_DOMAINS   可选，默认 ocrtext.top

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cn
  cancel-in-progress: false

env:
  DOMAIN: yunshufz.top
  SITE_ROOT: ${{ vars.SITE_ROOT || '/var/www/yunshufz.top' }}
  GUARD_DOMAINS: ${{ vars.GUARD_DOMAINS || 'ocrtext.top' }}
  # live = 正常发布；paused = 整站 503 + 维护页（vhost 里已写成暂停，两边必须一致）
  SITE_STATE: ${{ vars.SITE_STATE || 'live' }}

jobs:
  deploy:
    name: 部署 yunshufz.top（国内机 nginx）
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v4.3.0 —— 官方建议按 commit SHA 固定，避免 tag 被移动
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 准备 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo '::error::缺少 secret DEPLOY_SSH_KEY（部署私钥全文）'
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 30"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          if ! ssh -o BatchMode=yes deploy true 2>/tmp/ssh.err; then
            echo '::error::SSH 公钥登录失败，下面是客户端看到的原话'
            tail -5 /tmp/ssh.err
            ssh -vv -o BatchMode=yes deploy true 2>&1 \
              | grep -Ei 'Offering|Authentications that can|Next authentication|Server accepts|sign_and_send|Load key' \
              | tail -12 || true
            exit 1
          fi
          ssh deploy 'echo "ssh ok"; hostname; whoami'

      - name: 侦察（只读，不改任何东西）
        run: |
          set -euo pipefail
          ssh deploy "bash -s" <<'REMOTE'
          set -uo pipefail
          echo '--- nginx ---'
          nginx -v 2>&1
          sudo nginx -t 2>&1 | tail -2
          echo '--- conf.d ---'
          ls -1 /etc/nginx/conf.d/ 2>/dev/null
          echo '--- 本站目录 ---'
          ls -1d /var/www/* 2>/dev/null
          echo '--- 证书 ---'
          sudo certbot certificates 2>/dev/null | grep -E 'Certificate Name|Domains|Expiry' | head -10
          echo '--- 磁盘 ---'
          df -h / | tail -1
          REMOTE

          # 改动前先记下同机其它站点的状态：只有「原本正常、之后不正常」才算我们弄坏的
          : > /tmp/baseline.txt
          for d in $GUARD_DOMAINS; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$d/" 2>/dev/null || true)
            echo "$d ${code:-000}" >> /tmp/baseline.txt
          done
          echo '--- 改动前基线 ---'
          cat /tmp/baseline.txt

      - name: 同步静态文件（只写自己的目录）
        run: |
          set -euo pipefail
          ssh deploy "mkdir -p '$SITE_ROOT'"
          # 只放「给浏览器看」的东西：生成器源码、文档、隐藏文件一律不上服务器
          rsync -az --delete \
            --exclude '.*' \
            --exclude 'content' --exclude 'tools' \
            --exclude '*.md' --exclude 'package.json' \
            ./ deploy:"$SITE_ROOT/"
          ssh deploy "find '$SITE_ROOT' -maxdepth 1 -type f \
            \( -name '.*' -o -name '*.md' \) -delete 2>/dev/null; true"
          echo "已同步到 $SITE_ROOT"
          ssh deploy "du -sh '$SITE_ROOT'; find '$SITE_ROOT' -maxdepth 1 -type f | wc -l"

      - name: 同步 vhost 配置（仓库为准）
        run: |
          set -euo pipefail
          # nginx 配置也进仓库，改动可 review、可回滚；服务器上那份只是它的副本。
          # 用 sudo tee：`sudo cat >` 的重定向由普通用户 shell 执行，会 Permission denied
          ssh deploy "sudo tee /etc/nginx/conf.d/yunshufz.top.conf > /dev/null" < deploy/nginx/yunshufz.top.conf
          ssh deploy "sudo chmod 644 /etc/nginx/conf.d/yunshufz.top.conf && wc -l /etc/nginx/conf.d/yunshufz.top.conf"

      - name: 校验并 reload nginx（失败即止，不重启）
        run: |
          set -euo pipefail
          ssh deploy "bash -s" <<'REMOTE'
          set -euo pipefail
          echo '--- nginx -t ---'
          # 配置不过就到此为止：nginx 继续跑旧配置，同机其它站点不受影响
          if ! sudo nginx -t; then
            echo '::error::nginx 配置校验失败，未 reload（现网配置未变）'
            exit 1
          fi
          echo '--- reload（graceful） ---'
          sudo systemctl reload nginx
          sleep 1
          systemctl is-active nginx
          REMOTE

      - name: 自检（按 SITE_STATE 断言，并回查同机其它站点）
        run: |
          set -euo pipefail
          echo "SITE_STATE=$SITE_STATE"

          if [ "$SITE_STATE" = "paused" ]; then
            echo "--- 暂停模式：所有页面必须 503，且 503 带维护页正文 ---"
            for page in / /products.html /products/vivace.html /en/ /about.html \
                        /privacy.html /assets/style.css; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN$page" 2>/dev/null || true)
              printf '%-28s -> %s\n' "$page" "${code:-000}"
              [ "${code:-000}" = "503" ] || { echo "::error::$page 应该是 503，实际 ${code:-000}"; exit 1; }
            done

            echo "--- 维护页正文（503 也要给出人话，不能是空响应） ---"
            page=$(curl -sS --max-time 20 "https://$DOMAIN/")
            for needle in '站点正在维护' 'maintenance' '广州云枢方舟科技有限公司'; do
              if printf '%s' "$page" | grep -qF "$needle"; then
                echo "ok   $needle"
              else
                echo "::error::503 响应里找不到：$needle"
                exit 1
              fi
            done

            echo "--- 直接访问维护页应当拿不到（internal） ---"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN/maintenance.html" || true)
            echo "/maintenance.html -> ${code:-000}（期望 404/503）"

            echo "--- 证书仍然有效（暂停不能把 https 弄坏） ---"
            echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null \
              | openssl x509 -noout -issuer -dates 2>/dev/null || echo '读不到证书'
          else
            echo "--- $DOMAIN 首页 ---"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://$DOMAIN/" 2>/dev/null || true)
            echo "https://$DOMAIN/ -> ${code:-000}"
            [ "$code" = "200" ] || { echo "::error::首页不是 200"; exit 1; }

            echo "--- 关键页面 ---"
            for page in / /products.html /products/vivace.html /products/palmglow.html \
                        /products/shiyin.html /products/grove.html /en/ /en/products.html \
                        /about.html /support.html /privacy.html /terms.html \
                        /robots.txt /sitemap.xml; do
              printf '%-30s -> ' "$page"
              curl -fsS -o /dev/null -w '%{http_code}\n' --max-time 20 "https://$DOMAIN$page" || echo 'FAIL'
            done

            echo "--- 内容抽检（不只是 200，还要是这一版） ---"
            home=$(curl -fsS --max-time 20 "https://$DOMAIN/")
            check() {
              if printf '%s' "$home" | grep -qF "$1"; then
                echo "ok   $2"
              else
                echo "FAIL $2（页面里找不到：$1）"
                exit 1
              fi
            }
            check '广州云枢方舟科技有限公司' '公司全称与执照一致'
            check '190 号亿能大厦 1207 室 A293' '注册地址'
            check "https://$DOMAIN/" 'canonical 指向本站'
            check 'support@' '联系方式'
            check 'PalmGlow' '产品（掌光）'

            echo "--- 不存在的路径要回 404 ---"
            code404=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN/definitely-not-here-$(date +%s)")
            echo "/definitely-not-here -> $code404"
            [ "$code404" = "404" ] || echo "::warning::404 页返回了 $code404（软 404，不影响审核但不够干净）"
          fi

          echo "--- HTTP 必须跳 HTTPS ---"
          redir=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "http://$DOMAIN/")
          echo "http://$DOMAIN/ -> $redir"
          case "$redir" in
            30[18]\ https://*) echo 'ok   301/308 到 https' ;;
            *) echo "::error::HTTP 没有正确跳转 HTTPS：$redir"; exit 1 ;;
          esac

          echo "--- 证书 ---"
          echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null \
            | openssl x509 -noout -issuer -dates 2>/dev/null || echo '读不到证书'

          echo "--- 回归检查：其它站点不能比改动前更差 ---"
          broken=0
          while read -r d before; do
            [ -n "$d" ] || continue
            after=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$d/" 2>/dev/null || true)
            echo "$d  改动前=$before  现在=${after:-000}"
            if [ "$before" = "200" ] && [ "$after" != "200" ]; then broken=1; fi
          done < /tmp/baseline.txt
          [ "$broken" = "0" ] || { echo '::error::同机其它站点状态变差，请立刻检查 nginx'; exit 1; }

          echo "✅ 部署完成，同机其它站点正常"
