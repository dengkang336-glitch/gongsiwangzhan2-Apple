name: deploy

# 推 main 自动把本站部署到 43.162.93.153（静态站，由服务器上已有的 Caddy 容器发出）。
# 本机（大陆）到这台境外服务器的 22/80/443 被阻断，所以走 GitHub 海外 runner 中转。
#
# ⚠️ 这台服务器上还跑着别的站点（念园 memorialgrove3D 等）。
# 本工作流只做「加法」：
#   - 自己的静态文件放进单独子目录，绝不动上一级已有的文件；
#   - 自己的站点块写成单独文件，绝不改写别人的 .caddy；
#   - reload 前先 `caddy validate`，校验不过就把自己的站点块删掉、不 reload、直接失败；
#   - reload 后回查其它域名仍是 200，否则同样回滚并失败。
#
# 需要的仓库 secrets（Settings → Secrets and variables → Actions）：
#   DEPLOY_HOST      43.162.93.153
#   DEPLOY_USER      ubuntu
#   DEPLOY_SSH_KEY   部署私钥全文（与 jinianren3D / gongsiwangzhan 仓库里同一把）
#   DEPLOY_PORT      可选，默认 22
#
# 需要的仓库 Variable：
#   DOMAIN           yunshufz.top
#   SITE_SUBDIR      可选，默认 yunshufz（决定落在容器挂载目录下哪个子目录）
#   GUARD_DOMAINS    可选，空格分隔的其它站点域名，reload 后逐个回查（默认 mamorialgrove.top）

# ⚠️ 2026-11-20 起 yunshufz.top 的 DNS 已指向国内机（129.204.52.104），
# 这份「海外机 + Caddy」的部署默认不再随 push 运行，只留作手动/备用。
# 日常发布看 deploy.yml（国内机 + nginx）。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-yunshufz
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 yunshufz.top（静态站）
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN: ${{ vars.DOMAIN || 'yunshufz.top' }}
      SITE_SUBDIR: ${{ vars.SITE_SUBDIR || 'yunshufz' }}
      GUARD_DOMAINS: ${{ vars.GUARD_DOMAINS || 'mamorialgrove.top' }}
      CADDY_DIR: /opt/jinianren3d/caddy-sites
      CADDY_CONTAINER: jinianren-caddy

    steps:
      # v4.3.0 —— 官方建议按 commit SHA 固定，避免 tag 被移动
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 准备 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '43.162.93.153' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo '::error::缺少 secret DEPLOY_SSH_KEY（部署私钥全文）'
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 30"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          if ! ssh -o BatchMode=yes deploy true 2>/tmp/ssh.err; then
            echo '::error::SSH 公钥登录失败，下面是客户端看到的原话'
            tail -5 /tmp/ssh.err
            echo '--- 服务器认可哪些认证方式、我们递了哪把钥匙 ---'
            ssh -vv -o BatchMode=yes deploy true 2>&1 \
              | grep -Ei 'Offering|Authentications that can|Next authentication|Server accepts|sign_and_send|Load key' \
              | tail -12 || true
            exit 1
          fi
          ssh deploy 'echo "ssh ok"; hostname; whoami'

      - name: 侦察（只读，不改任何东西）
        id: probe
        run: |
          set -euo pipefail
          ssh deploy "CADDY_CONTAINER='$CADDY_CONTAINER' bash -s" <<'REMOTE' | tee /tmp/probe.txt
          set -uo pipefail
          echo '--- 容器挂载 ---'
          docker inspect "$CADDY_CONTAINER" \
            --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Type}}){{"\n"}}{{end}}' 2>/dev/null \
            || echo 'docker inspect 失败'
          echo '--- 现有站点块 ---'
          ls -1 /opt/jinianren3d/caddy-sites/ 2>/dev/null || echo '目录不存在'
          echo '--- Caddyfile ---'
          docker exec "$CADDY_CONTAINER" cat /etc/caddy/Caddyfile 2>/dev/null || echo '读不到 Caddyfile'
          echo '--- 80/443 谁在听 ---'
          (sudo ss -ltnp 2>/dev/null || ss -ltn 2>/dev/null) | grep -E ':(80|443) ' || echo '看不到'
          echo '--- 磁盘 ---'
          df -h /opt | tail -1
          REMOTE

          # 改动前先记下同机其它站点的状态：只有“原本正常、之后不正常”才算我们弄坏的
          : > /tmp/baseline.txt
          for d in $GUARD_DOMAINS; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$d/" 2>/dev/null || true)
            echo "$d ${code:-000}" >> /tmp/baseline.txt
          done
          echo '--- 改动前基线 ---'
          cat /tmp/baseline.txt

          # 从挂载里找出承载静态站的宿主机目录（优先 company-site）
          SRC="$(grep -oE '/[^ ]*company-site -> [^ ]*' /tmp/probe.txt | head -1 | cut -d' ' -f1)"
          if [ -z "$SRC" ]; then
            echo '::warning::没在挂载里找到 company-site，回退到 /opt/jinianren3d/company-site'
            SRC=/opt/jinianren3d/company-site
          fi
          echo "host_root=$SRC" >> "$GITHUB_OUTPUT"
          echo "静态站宿主机目录：$SRC"
          # 站点块目录若不存在，用同一套约定
          echo "站点块：$CADDY_DIR"

      - name: 同步静态文件（只写自己的子目录）
        env:
          HOST_ROOT: ${{ steps.probe.outputs.host_root }}
        run: |
          set -euo pipefail
          TARGET="$HOST_ROOT/$SITE_SUBDIR"
          ssh deploy "sudo mkdir -p '$TARGET' && sudo chown -R \"\$USER:\$USER\" '$TARGET'"
          # 只放「给浏览器看」的东西进来：生成器源码、文档、隐藏文件一律不上服务器
          rsync -az --delete \
            --exclude '.*' \
            --exclude 'content' --exclude 'tools' \
            --exclude '*.md' --exclude 'package.json' \
            ./ deploy:"$TARGET/"
          # --delete 不会删被 exclude 的文件，历史遗留的开发文件手动清一遍
          ssh deploy "find '$TARGET' -maxdepth 1 -type f \
            \\( -name '.*' -o -name '*.md' \\) -delete 2>/dev/null; true"
          echo "已同步到 $TARGET"
          ssh deploy "find '$TARGET' -maxdepth 1 | head -12; echo '...'; du -sh '$TARGET'"

      - name: 写站点块 → validate → reload（失败即回滚）
        env:
          HOST_ROOT: ${{ steps.probe.outputs.host_root }}
        run: |
          set -euo pipefail
          # 宿主机目录 → 容器内路径
          CONTAINER_ROOT="$(grep -F "$HOST_ROOT ->" /tmp/probe.txt | sed -E 's/.* -> ([^ ]+) \(.*/\1/')"
          if [ -z "$CONTAINER_ROOT" ]; then
            echo '::error::无法把宿主机目录映射到容器内路径，放弃（不改动任何 Caddy 配置）'
            exit 1
          fi
          echo "容器内路径：${CONTAINER_ROOT}/${SITE_SUBDIR}"

          ssh deploy "DOMAIN='$DOMAIN' ROOT='${CONTAINER_ROOT}/${SITE_SUBDIR}' BLOCK='$CADDY_DIR/$DOMAIN.caddy' CADDY='$CADDY_CONTAINER' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$(dirname "$BLOCK")"
          cat > "$BLOCK" <<EOF
          # 由 GitHub Actions 生成（仓库 gongsiwangzhan2-Apple），请勿手改。
          # 静态文件：$ROOT
          $DOMAIN {
              encode gzip zstd
              root * $ROOT
              try_files {path} {path}/index.html {path}.html
              file_server
              handle_errors {
                  rewrite * /{err.status_code}.html
                  file_server
              }
              log {
                  output stdout
                  format console
              }
          }

          # www 与裸域都解析到本机；审核方常手输 www，统一用 308 收到裸域，
          # 免得同一份内容出现两个地址（对 Apple 与 SEO 都更干净）。
          www.$DOMAIN {
              redir https://$DOMAIN{uri} 308
          }
          EOF
          echo '--- 新站点块 ---'
          cat "$BLOCK"

          rollback() {
            echo '::warning::回滚：删除本次新增的站点块'
            rm -f "$BLOCK"
            docker exec "$CADDY" caddy reload --config /etc/caddy/Caddyfile >/dev/null 2>&1 || true
          }
          trap 'rollback' ERR

          echo '--- caddy validate ---'
          if ! docker exec "$CADDY" caddy validate \
                --config /etc/caddy/Caddyfile --adapter caddyfile; then
            echo '::error::Caddyfile 校验失败（新站点块语法问题），已回滚'
            rollback; trap - ERR; exit 1
          fi

          echo '--- caddy reload（graceful，不断开现有站点） ---'
          # 只 reload，不 restart：restart 会让这台机器上所有站点瞬断。
          docker exec "$CADDY" caddy reload --config /etc/caddy/Caddyfile
          REMOTE

      - name: 自检（新域名 200 + 其它站点仍 200）
        run: |
          set -euo pipefail
          echo "--- $DOMAIN 首页（等 Caddy 签发证书，最多 120s） ---"
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN/" 2>/dev/null || true)
            echo "第 $i 次: HTTP ${code:-000}"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done

          echo "--- $DOMAIN 关键页面 ---"
          for page in / /products.html /products/vivace.html /products/palmglow.html \
                      /products/shiyin.html /products/grove.html /en/ /en/products.html \
                      /about.html /support.html /privacy.html /terms.html \
                      /robots.txt /sitemap.xml; do
            printf '%-30s -> ' "$page"
            curl -fsS -o /dev/null -w '%{http_code}\n' --max-time 20 "https://$DOMAIN$page" || echo 'FAIL'
          done

          echo "--- 内容抽检（不只是 200，还要是这一版） ---"
          home=$(curl -fsS --max-time 20 "https://$DOMAIN/")
          check() {
            if printf '%s' "$home" | grep -qF "$1"; then
              echo "ok   $2"
            else
              echo "FAIL $2（页面里找不到：$1）"
              exit 1
            fi
          }
          check '广州云枢方舟科技有限公司' '公司全称与执照一致'
          check '190 号亿能大厦 1207 室 A293' '注册地址'
          check "https://$DOMAIN/" 'canonical 指向本站'
          check 'support@' '联系方式'
          check 'PalmGlow' '产品（掌光）'

          echo "--- HTTP 必须跳 HTTPS ---"
          redir=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "http://$DOMAIN/")
          echo "http://$DOMAIN/ -> $redir"
          case "$redir" in
            30[187]\ https://*) echo 'ok   301/307/308 到 https' ;;
            *) echo "::error::HTTP 没有正确跳转 HTTPS：$redir"; exit 1 ;;
          esac

          echo "--- www 要收到裸域（www 的证书是第一次签，给它 60s） ---"
          www=''
          for i in $(seq 1 12); do
            www=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 "https://www.$DOMAIN/" 2>/dev/null || true)
            case "$www" in
              30[18]\ https://$DOMAIN/*) break ;;
            esac
            echo "第 $i 次: ${www:-000}"
            sleep 5
          done
          echo "https://www.$DOMAIN/ -> ${www:-无}"
          case "$www" in
            30[18]\ https://$DOMAIN/*) echo 'ok   www 已 308/301 到裸域' ;;
            *) echo "::warning::www 还没就绪（${www:-无}）：可能是证书还在签发，或在 DNS 上没这条 www 记录" ;;
          esac

          echo "--- 不存在的路径要回 404，不能软 404 ---"
          code404=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN/definitely-not-here-$(date +%s)")
          echo "/definitely-not-here -> $code404"
          [ "$code404" = "404" ] || echo "::warning::404 页返回了 $code404（软 404，不影响审核但不够干净）"

          echo "--- 压缩是否生效 ---"
          enc=$(curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' --max-time 20 "https://$DOMAIN/" | grep -i '^content-encoding' || true)
          echo "${enc:-没有 content-encoding}"

          echo "--- 回归检查：其它站点不能比改动前更差 ---"
          broken=0
          while read -r d before; do
            [ -n "$d" ] || continue
            after=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$d/" 2>/dev/null || true)
            echo "$d  改动前=$before  现在=${after:-000}"
            if [ "$before" = "200" ] && [ "$after" != "200" ]; then broken=1; fi
          done < /tmp/baseline.txt

          if [ "$ok" != "1" ]; then
            echo "::error::$DOMAIN 120 秒内未返回 200：多半是 DNS 未指向本机、或 80/443 被占用导致 ACME 签发失败"
            exit 1
          fi
          if [ "$broken" != "0" ]; then
            echo '::error::有其它站点没返回 200，说明这次改动疑似影响了同机其它站点，请立刻检查 Caddy 日志'
            exit 1
          fi
          echo '✅ 部署完成，同机其它站点正常'
