name: 构建自检

# Cloudflare Pages 的构建命令与这里一模一样（node tools/build.mjs）。
# 这里跑一遍是为了让「构建失败 / 产物有问题」在 GitHub 上就先红，而不是等 CF 那次部署。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: 构建
        run: |
          set -euo pipefail
          node --version
          node tools/build.mjs
      - name: 自检产物
        run: node tools/check.mjs
      - name: 确认 Cloudflare 需要的文件都在
        run: |
          set -euo pipefail
          for f in dist/index.html dist/404.html dist/sitemap.xml dist/robots.txt dist/_headers dist/_redirects dist/assets/style.css; do
            test -s "$f" && echo "ok $f" || { echo "缺失: $f"; exit 1; }
          done
