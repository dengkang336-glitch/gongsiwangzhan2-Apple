# 云枢方舟科技有限公司官网（静态站）——由仓库 gongsiwangzhan2-Apple 生成并部署。
# 与同机 ocrtext.top 完全隔离：独立 server 块、独立目录、独立证书、独立日志。
# 证书：Let's Encrypt（certbot webroot），续期由 certbot.timer 自动完成并 reload nginx。

server {
    listen 80;
    listen [::]:80;
    server_name yunshufz.top www.yunshufz.top;

    # certbot http-01 校验用，必须排在重定向之前且不能被 301 掉
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://yunshufz.top$request_uri;
    }
}

# www 与裸域都指向本机：www 的 443 单独收口到裸域，避免同一份内容出现两个地址
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yunshufz.top;

    ssl_certificate     /etc/letsencrypt/live/yunshufz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunshufz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://yunshufz.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yunshufz.top;

    ssl_certificate     /etc/letsencrypt/live/yunshufz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunshufz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/yunshufz.top;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 干净 URL：/products/palmglow -> /products/palmglow.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:jpg|jpeg|png|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    access_log /var/log/nginx/yunshufz.top.access.log;
    error_log  /var/log/nginx/yunshufz.top.error.log warn;
}
